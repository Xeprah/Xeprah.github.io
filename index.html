html,body{height:100%}

main{position:relative;z-index:10;height:100%;display:grid;place-items:center;grid-template-columns:minmax(0,1fr);overflow-y:auto;padding:16px;perspective:1200px}
.card{width:min(600px,100%);padding:28px 28px 22px;border-radius:24px;text-align:center;
  background:linear-gradient(180deg,rgba(20,16,16,.55),rgba(8,6,6,.6));

body.entered .card{opacity:1;transform:none}
/* stagger each piece in */
.card>*{opacity:0;transform:translateY(10px);transition:opacity .7s,transform .7s}
body.entered .card>*{opacity:1;transform:none}
body.entered .card>:nth-child(1){transition-delay:.35s}
body.entered .card>:nth-child(2){transition-delay:.45s}
body.entered .card>:nth-child(3){transition-delay:.55s}
body.entered .card>:nth-child(4){transition-delay:.65s}
body.entered .card>:nth-child(5){transition-delay:.75s}

body.muted .slide input::-webkit-slider-thumb{opacity:0}

// typewriter: the whole line is laid out first (invisible), then letters are revealed,
// so nothing shifts or re-centres while it types
let started = false;
async function typeLoop(){
  if (started) return; started = true;
  const el = $("bio"), wait = ms => new Promise(r => setTimeout(r, ms));
  // shuffled order: every line plays once before any repeats, your main line always opens,
  // and a new shuffle never starts with the line that just played
  const lines = CONFIG.bios, first = lines[0];
  let bag = [], prev = null;
  const next = () => {
    if (prev === null) return first;
    if (!bag.length){
      bag = lines.slice();
      for (let i = bag.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
      if (bag.length > 1 && bag[0] === prev) bag.push(bag.shift());
    }
    return bag.shift();
  };
  for (;;){
    const t = next();
    if (prev === null) bag = lines.filter(l => l !== first).sort(() => Math.random() - .5);
    prev = t;
    el.innerHTML = [...t].map(ch => `<span>${ch === "<" ? "&lt;" : ch}</span>`).join("");
    const s = el.children; let last = null;
    const caret = n => { last?.classList.remove("cur"); last = s[Math.max(n-1,0)]; last?.classList.add("cur"); el.classList.toggle("empty", n === 0); };
    caret(0);
    for (let k = 1; k <= s.length; k++){ s[k-1].classList.add("on"); caret(k); await wait(45 + Math.random()*55); }
    await wait(3000);
    for (let k = s.length; k > 0; k--){ s[k-1].classList.remove("on"); caret(k-1); await wait(18); }
    await wait(450);
  }
}

  return m < 1 ? "just now" : m < 60 ? `${m}m ago` : h < 24 ? `${h}h ago` : `${d}d ago`;

// album colour glow: averages the cover's colours and slowly tints the fog with them
let glowFor = null;
function albumGlow(url){
  if (url === glowFor) return; glowFor = url;
  const img = new Image(); img.crossOrigin = "anonymous";
  img.onload = () => {
    try {
      const cv = document.createElement("canvas"); cv.width = cv.height = 24;
      const x = cv.getContext("2d"); x.drawImage(img, 0, 0, 24, 24);
      const px = x.getImageData(0, 0, 24, 24).data; let best = [], all = [0,0,0], n = 0;
      for (let i = 0; i < px.length; i += 4){
        const [r,g,b] = [px[i],px[i+1],px[i+2]], sat = Math.max(r,g,b) - Math.min(r,g,b);
        all[0]+=r; all[1]+=g; all[2]+=b; n++; if (sat > 40) best.push([r,g,b]);
      }
      const avg = a => a.reduce((s,c) => [s[0]+c[0],s[1]+c[1],s[2]+c[2]],[0,0,0]).map(v => v/a.length);
      const main = best.length > 20 ? avg(best) : all.map(v => v/n);
      const dim = (c, f) => c.map(v => Math.min(255, v*f));
      fogTarget = [dim(main,.42), dim(main,.28), dim(main,.22)];
    } catch { fogTarget = BASE; }
  };
  img.src = url;
}

// animated night sky: gradient, drifting fog, twinkling stars, shooting stars, snow
const sky = $("sky"), c = sky.getContext("2d"); let W, H, stars, flakes, shoot = null, px = 0, py = 0;
function size(){
  W = sky.width = innerWidth; H = sky.height = innerHeight;
  stars = Array.from({length: W*H/6000}, () => ({x:Math.random()*W, y:Math.random()*H*.75, r:Math.random()*1.1+.2, p:Math.random()*7, s:Math.random()*.02+.005}));
  flakes = Array.from({length: Math.min(110, W/11)}, () => ({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.7+.4, v:Math.random()*.5+.2, d:Math.random()*7}));
}
size(); addEventListener("resize", size);
const BASE = [[70,22,28],[60,60,66],[40,36,40]];
const fog = [{x:.2,y:.7,r:.6,c:[...BASE[0]],v:.00006},{x:.8,y:.3,r:.5,c:[...BASE[1]],v:-.00005},{x:.5,y:.95,r:.7,c:[...BASE[2]],v:.00004}];
let fogTarget = BASE;
(function frame(t){
  const g = c.createLinearGradient(0,0,0,H); g.addColorStop(0,"#030202"); g.addColorStop(.6,"#0c0808"); g.addColorStop(1,"#121012");
  c.fillStyle = g; c.fillRect(0,0,W,H);
  for (const f of fog){
    const x = (f.x + Math.sin(t*f.v)*.15)*W, y = f.y*H, r = f.r*Math.max(W,H);
    const rg = c.createRadialGradient(x,y,0,x,y,r); const k = fog.indexOf(f), tg = fogTarget[k]; for (let q = 0; q < 3; q++) f.c[q] += (tg[q] - f.c[q]) * .008;
    const col = f.c.map(Math.round).join(","); rg.addColorStop(0,`rgba(${col},.35)`); rg.addColorStop(1,`rgba(${col},0)`);
    c.fillStyle = rg; c.fillRect(0,0,W,H);
  }
  // stars drift slightly with the mouse (bigger stars move more = depth)
  px += ((mx > 0 ? mx/W - .5 : 0) - px)*.04; py += ((my > 0 ? my/H - .5 : 0) - py)*.04;
  for (const s of stars){ s.p += s.s; c.globalAlpha = .35 + Math.sin(s.p)*.35; c.fillStyle = "#fff";
    c.beginPath(); c.arc(s.x - px*s.r*18, s.y - py*s.r*18, s.r, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  if (!shoot && Math.random() < .004) shoot = {x:Math.random()*W*.8, y:Math.random()*H*.35, l:0};
  if (shoot){
    shoot.l += 14; const x = shoot.x + shoot.l, y = shoot.y + shoot.l*.45;
    const lg = c.createLinearGradient(x-120,y-54,x,y); lg.addColorStop(0,"rgba(255,255,255,0)"); lg.addColorStop(1,"rgba(255,255,255,.9)");
    c.strokeStyle = lg; c.lineWidth = 1.4; c.beginPath(); c.moveTo(x-120,y-54); c.lineTo(x,y); c.stroke();
    if (shoot.l > W*.5) shoot = null;
  }
  c.fillStyle = "rgba(220,210,210,.55)";
  for (const f of flakes){ f.y += f.v; f.d += .01; f.x += Math.sin(f.d)*.3;
    if (f.y > H){ f.y = -4; f.x = Math.random()*W; }
    c.beginPath(); c.arc(f.x,f.y,f.r,0,7); c.fill(); }
  requestAnimationFrame(frame);
})(0);
</script>
